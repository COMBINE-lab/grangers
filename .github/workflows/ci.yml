name: grangers-check

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build_and_test:
    if: "!contains(github.event.head_commit.message, 'skip ci')"
    strategy:
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # Cheap and compiles nothing, so it runs first.
      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --verbose

      # Covers the GTF/GFF parse path, which is the part of this crate that has
      # historically broken silently across noodles and polars upgrades.
      - name: Run tests
        run: cargo test --verbose

      # The ecosystem standardises on the pure-Rust `zlib-rs` flate2 backend (see
      # the note in Cargo.toml). Assert that it is what we actually resolve, and
      # that no C zlib has crept back in -- those need a system library or cmake,
      # which is what made grangers unbuildable on hosts without them.
      - name: Assert the flate2 backend is zlib-rs
        shell: bash
        run: |
          cargo tree -e normal > tree.txt
          if ! grep -qE '\bzlib-rs v[0-9]' tree.txt; then
            echo "::error::zlib-rs is not in the dependency tree; the flate2 backend pin was lost"
            exit 1
          fi
          if grep -qE 'libz-ng-sys|libz-sys|cloudflare-zlib-sys' tree.txt; then
            echo "::error::a C zlib backend crept into the dependency tree"
            grep -E 'libz-ng-sys|libz-sys|cloudflare-zlib-sys' tree.txt
            exit 1
          fi
