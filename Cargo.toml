[package]
name = "grangers"
version = "0.6.0"
edition = "2021"
rust-version = "1.88"
authors = ["Dongze He <dhe17@umd.edu>", "Rob Patro <rob@cs.umd.edu>"]
description = "A rust library for working with genomic ranges and annotations."
license-file = "LICENSE"
readme = "README.md"
repository = "https://github.com/COMBINE-lab/grangers"
homepage = "https://github.com/COMBINE-lab/grangers"
include = [
  "/src/lib.rs",
  "/src/grangers_info.rs",
  "/src/grangers_utils.rs",
  "/src/options.rs",
  "/src/reader.rs",
  "/src/reader/*.rs",
  "/tests/**",
  "/Cargo.toml",
  "/README.md",
  "/LICENSE",
]
keywords = ["genomics", "GTF-GFF", "ranges", "genes", "genome-annotation"]
categories = ["science", "data-structures"]

[lib]
doctest = false

[dependencies]
anyhow = "1.0"
# The whole alevin-fry ecosystem standardises on the pure-Rust `zlib-rs` backend,
# and every crate in it requests that backend explicitly rather than relying on
# the top-level binary to remember. Selecting it here is safe in a way that
# selecting `zlib-ng` was not: `zlib-rs` pulls no system library and needs no
# cmake, so it cannot make grangers unbuildable anywhere. Leaving it unset is the
# thing to avoid -- grangers would silently fall back to miniz_oxide, which is
# both slower and a second decompressor in any tree that also wants zlib-rs.
#
# `default-features = false` means we do not ask for flate2's default
# `rust_backend`. That does not remove miniz_oxide from the tree -- polars-utils
# requests flate2 with default features, and cargo unions features graph-wide --
# but it does not matter which crate asks: flate2 gates the pure-Rust path on
# `not(any_zlib)`, and `zlib-rs` sets `any_zlib`, so zlib-rs is the live backend
# and miniz_oxide is compiled but unused.
flate2 = { version = "1.1.9", default-features = false, features = ["zlib-rs"] }
noodles = { version = "0.115.0", features = ["gtf", "gff", "fasta", "core"] }
tracing = "0.1.41"
polars = { version = "0.53", features = [
  "lazy",
  "dataframe_arithmetic",
  "checked_arithmetic",
  "rows",
  "dtype-struct",
  "dtype-categorical",
  "list_eval",
  "concat_str",
  "strings",
  "is_in",
  "abs",
  "regex",
  "timezones",
  "polars-ops"
] }
rust-lapper = "1.3.0"
nutype = "0.7.0"
