[package]
name = "grangers"
version = "0.5.0"
edition = "2021"
rust-version = "1.88"
authors = ["Dongze He <dhe17@umd.edu>", "Rob Patro <rob@cs.umd.edu>"]
description = "A rust library for working with genomic ranges and annotations."
license-file = "LICENSE"
readme = "README.md"
repository = "https://github.com/COMBINE-lab/grangers"
homepage = "https://github.com/COMBINE-lab/grangers"
include = [
  "/src/lib.rs",
  "/src/grangers_info.rs",
  "/src/grangers_utils.rs",
  "/src/options.rs",
  "/src/reader.rs",
  "/src/reader/*.rs",
  "/tests/**",
  "/Cargo.toml",
  "/README.md",
  "/LICENSE",
]
keywords = ["genomics", "GTF-GFF", "ranges", "genes", "genome-annotation"]
categories = ["science", "data-structures"]

[lib]
doctest = false

[dependencies]
anyhow = "1.0"
# NOTE: deliberately no backend feature. grangers only ever *decompresses*, and a
# library that hard-selects a flate2 backend forces that choice on every consumer
# (cargo features are additive) -- that is exactly what pinned the whole
# alevin-fry ecosystem to zlib-ng. With plain defaults, a downstream binary is
# free to select `zlib-rs` by depending on flate2 itself; flate2's `any_zlib`
# precedence then makes that the live backend here too.
flate2 = "1.1.9"
noodles = { version = "0.115.0", features = ["gtf", "gff", "fasta", "core"] }
tracing = "0.1.41"
polars = { version = "0.53", features = [
  "lazy",
  "dataframe_arithmetic",
  "checked_arithmetic",
  "rows",
  "dtype-struct",
  "dtype-categorical",
  "list_eval",
  "concat_str",
  "strings",
  "is_in",
  "abs",
  "regex",
  "timezones",
  "polars-ops"
] }
rust-lapper = "1.3.0"
nutype = "0.7.0"
